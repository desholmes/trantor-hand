[project]
name = "trantor-type"
version = "1.0.0"
description = "The Trantor font series, built as TTF and webfonts from OFL fonts by Roger Sperberg."
readme = "README.md"
license = "OFL-1.1 AND MIT"  # fonts OFL, build code MIT (LICENSE-CODE)
requires-python = ">=3.12"
# Exact pins only: add or change dependencies with make add PKG=name==version.
dependencies = [
    "fonttools[woff]==4.67.0",
    "skia-pathops==0.9.2",
]

[tool.uv]
# The build scripts are run in place; there is no package to install.
package = false
# Install wheels only, so no third-party build code runs on install.
no-build = true
# Ignore releases newer than this; refreshed by make update-exclude-newer.
exclude-newer = "2026-10-24T19:27:33Z"
